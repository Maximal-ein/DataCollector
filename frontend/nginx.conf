# Раздача React SPA + проксирование API на сервис api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # сжатие JSON-ответов (сводная таблица до ~6 МБ → ~600 КБ)
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF-справки и диагностика МГЭ могут выполняться до ~2 минут
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4m;
    }

    # healthcheck API (используется мониторингом; SPA проверяет его же)
    location = /health {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # SPA с history-роутингом
    location / {
        try_files $uri $uri/ /index.html;
    }
}
